name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run 'gofmt -s -w .' on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Unit tests
        run: go test -v -count=1 -cover ./...

  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Fails when the provider calls code with a known vulnerability
      # (https://vuln.go.dev), in a dependency or in the Go standard library.
      - name: govulncheck
        run: make vuln

  docs:
    name: Docs are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # tfplugindocs reads the provider schema through the Terraform CLI.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Examples are formatted
        run: terraform fmt -check -recursive -diff examples/

      - name: Generate docs
        run: make docs

      - name: No changes after generating docs
        run: |
          git add --intent-to-add .
          git diff --exit-code || {
            echo "docs/ is out of date: run 'make docs' and commit the result."
            exit 1
          }
