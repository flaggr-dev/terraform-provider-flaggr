version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # The plugin framework, protocol and testing modules move together.
      terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"

  # Also updates the commit-pinned actions in release.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
